<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>화음 코치</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 홈: 곡 목록 -->
  <section class="screen active" id="home">
    <header><h1>🎤 화음 코치</h1><button class="icon" data-go="settings" aria-label="설정">⚙️</button></header>
    <div class="content">
      <div id="updateBanner" class="banner hidden">
        <span>새 버전 <b id="updateVer"></b></span>
        <button class="primary" id="updateNow">업데이트</button>
      </div>
      <div id="songList" class="list"></div>
      <label class="add">＋ 곡 파일 추가<input type="file" id="songFile" accept=".json,application/json" hidden /></label>
    </div>
  </section>

  <!-- 가사 넣기 (처음 한 번) -->
  <section class="screen" id="lyrics">
    <header><button class="icon" data-go="home" aria-label="뒤로">←</button><h2 id="lyTitle">가사</h2></header>
    <div class="content">
      <p class="muted">가사는 저작권 때문에 앱에 들어 있지 않아요. 한 번만 붙여넣으면 이 폰에만 저장돼요.</p>
      <textarea id="lyText" placeholder="가사를 붙여넣으세요 (멜론·지니 가사 그대로)"></textarea>
      <p id="lyCheck" class="small muted"></p>
      <button class="primary big" id="lySave">저장하고 시작</button>
    </div>
  </section>

  <!-- 연습 -->
  <section class="screen" id="play">
    <div id="fb" class="fb"></div>
    <header class="clear"><button class="icon" id="plBack" aria-label="뒤로">←</button><h2 id="plTitle"></h2><span id="plTime" class="mono"></span></header>
    <div class="stage">
      <div id="arrow" class="arrow"></div>
      <div id="hint" class="hint"></div>
      <div class="lyric">
        <div id="lyNow" class="now"></div>
        <div id="lyNext" class="next"></div>
      </div>
    </div>
    <div class="bar"><div id="prog"></div></div>
    <div class="controls">
      <div class="seg" id="harmSeg">
        <button data-h="third_up" aria-pressed="true">3도 위</button>
        <button data-h="third_down" aria-pressed="false">3도 아래</button>
        <button data-h="sixth_down" aria-pressed="false">6도 아래</button>
      </div>
      <div class="row">
        <button class="round" id="plRestart" aria-label="처음부터">⏮</button>
        <button class="round big" id="plPlay" aria-label="재생">▶</button>
        <button class="round" id="plTone" aria-label="화음음 켜기/끄기">🔊</button>
      </div>
    </div>
  </section>

  <!-- 결과 -->
  <section class="screen" id="result">
    <header><button class="icon" data-go="home" aria-label="뒤로">←</button><h2>결과</h2></header>
    <div class="content center">
      <div class="score"><span id="rsScore">0</span><small>%</small></div>
      <p id="rsText" class="muted"></p>
      <button class="primary big" id="rsAgain">다시 하기</button>
    </div>
  </section>

  <!-- 설정 -->
  <section class="screen" id="settings">
    <header><button class="icon" data-go="home" aria-label="뒤로">←</button><h2>설정</h2></header>
    <div class="content">
      <div class="field">허용 오차
        <div class="seg" id="tolSeg">
          <button data-t="70">넉넉하게</button><button data-t="50">보통</button><button data-t="30">정확하게</button>
        </div>
        <span class="small muted">보통 = 반음의 절반(50센트)까지 초록색</span>
      </div>
      <label class="chk"><input type="checkbox" id="setOct" />옥타브 달라도 인정</label>
      <label class="field">화음음 크기 <input type="range" id="setVol" min="0.02" max="0.4" step="0.02" /></label>
      <label class="chk"><input type="checkbox" id="setSlow" />천천히 (0.8배속)</label>
      <hr />
      <div class="row"><span class="muted">버전 <b id="appVer"></b></span><span class="spacer"></span><button id="updateCheck">업데이트 확인</button></div>
      <p class="small muted">🎧 이어폰을 끼세요. 스피커로 들으면 마이크가 화음음을 내 목소리로 착각할 수 있어요.</p>
    </div>
  </section>

  <div id="toast" class="toast"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>

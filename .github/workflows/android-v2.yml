name: Build Android APK (v2)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-build/v2/**'
      - '.github/workflows/android-v2.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create Capacitor project
        run: |
          mkdir -p app/www
          cp -r v2/. app/www/
          cp android-build/v2/capacitor.config.json app/
          cd app
          npm init -y >/dev/null
          npm install @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0
          npx cap add android
          npx cap sync android
      - name: Permissions and icon
        run: |
          cd app/android/app/src/main
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />#' AndroidManifest.xml
          grep -n "RECORD_AUDIO" AndroidManifest.xml
          rm -rf res/mipmap-anydpi-v26
          for d in res/mipmap-*; do
            cp "$GITHUB_WORKSPACE/icons/icon-192.png" "$d/ic_launcher.png"
            cp "$GITHUB_WORKSPACE/icons/icon-192.png" "$d/ic_launcher_round.png"
            rm -f "$d/ic_launcher_foreground.png"
          done
      - name: Build APK
        run: |
          mkdir -p ~/.android
          cp android-build/debug.keystore ~/.android/debug.keystore
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/harmony-coach-2.apk"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v2
          name: 화음 코치 2 안드로이드 앱
          body: |
            📱 새 화음 코치(화음 코치 2)예요. 기존 '화음 코치' 앱과 따로 설치돼요.
            안드로이드 폰에서 아래 harmony-coach-2.apk 를 눌러 다운로드한 뒤 설치하세요.
            처음 설치할 때 "출처를 알 수 없는 앱" 설치 허용이 필요할 수 있어요.
          files: harmony-coach-2.apk
          make_latest: false

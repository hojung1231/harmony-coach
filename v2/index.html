<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F6F6F8" />
  <title>화음 코치 2</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="../icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<!-- 첫 화면: 곡 목록 -->
<main class="screen" id="home" aria-label="곡 목록">
  <header class="banner"><h1>화음 코치</h1></header>
  <div class="songs" id="songs"></div>
  <p class="empty" id="empty">아직 곡이 없어요.<br>아래 ＋ 를 눌러 첫 곡을 추가해 보세요.</p>
</main>
<button class="fab" id="addSong" type="button" aria-label="곡 추가"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

<!-- 곡 추가: 한 단계씩 -->
<main class="screen" id="add" aria-label="곡 추가" hidden>
  <header class="banner"><button class="back" id="addBack" type="button" aria-label="뒤로">←</button><h1>곡 추가</h1><span class="stepno" id="stepNo"></span></header>

  <!-- 1단계: MP3 -->
  <section id="s1" class="screen-part">
    <p class="q">어떤 곡을 연습할까요?</p>
    <p class="sub">폰에 있는 곡의 MP3 파일을 골라 주세요.</p>
    <label class="drop" id="drop">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      내 폰에서 MP3 올리기
      <small>멜론·지니에서 받은 파일이면 가사도 함께 읽어요</small>
      <input type="file" id="mp3" accept="audio/mpeg,audio/*,.mp3" />
    </label>
    <div id="picked" hidden style="display:flex;flex-direction:column;gap:12px">
      <div class="songcard"><div class="cover" id="pCover">♪</div><div class="meta"><div class="t" id="pTitle"></div><div class="a" id="pArtist"></div></div></div>
      <div class="note" id="pNote"></div>
      <div class="lyprev" id="pLy" hidden>
        <div class="hd"><b>파일에 들어 있는 가사</b><button type="button" id="pLyEdit">고치기</button></div>
        <div class="lybody" id="pLyBody"></div>
        <button class="more" type="button" id="pLyMore">가사 전체 보기</button>
      </div>
      <button class="ghost change" id="pChange" type="button">다른 파일 고르기</button>
    </div>
  </section>

  <!-- 2단계: 가사 (파일에 없을 때) -->
  <section id="s2" hidden style="display:flex;flex-direction:column;gap:12px">
    <p class="q" id="lyQ">가사를 넣어 주세요</p>
    <p class="sub" id="lySub">이 파일에는 가사가 들어 있지 않아요. 멜론·지니에서 가사를 복사해 붙여넣어 주세요.</p>
    <div class="links" id="lyLinks">
      <a id="lyMelon" target="_blank" rel="noopener">멜론에서 찾기</a>
      <a id="lyGenie" target="_blank" rel="noopener">지니에서 찾기</a>
    </div>
    <div class="links"><button id="lyPaste" type="button">📋 복사한 가사 붙여넣기</button></div>
    <textarea id="lyText" placeholder="여기에 가사를 붙여넣어요"></textarea>
  </section>

  <!-- 완료 -->
  <section id="s3" hidden style="display:flex;flex-direction:column;gap:14px">
    <div class="done-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <p class="q center">곡을 추가했어요</p>
    <div class="songcard"><div class="cover" id="dCover">♪</div><div class="meta"><div class="t" id="dTitle"></div><div class="a" id="dArtist"></div></div></div>
  </section>
</main>

<div class="sheetbg" id="lySheet" hidden>
  <div class="sheet" role="dialog" aria-label="가사">
    <div class="grab"></div>
    <div class="songcard" id="shCard"></div>
    <div class="scroll" id="shLyrics"></div>
    <button class="primary" type="button" id="shClose">닫기</button>
    <button class="ghost danger" type="button" id="shDelete">이 곡 삭제</button>
    <div class="confirm" id="shConfirm" hidden><span>정말 삭제할까요?</span><button class="ghost danger" type="button" id="shYes">삭제</button><button class="ghost" type="button" id="shNo">취소</button></div>
  </div>
</div>

<div class="dock" id="dock" hidden><div class="in">
  <button class="primary" id="next" type="button" disabled>다음</button>
  <button class="ghost" id="alt" type="button" hidden></button>
</div></div>

<div class="toast" id="toast"></div>
<script type="module" src="app.js"></script>
</body>
</html>
